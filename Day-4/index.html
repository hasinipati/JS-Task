<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Check the character is vowel or not</h1>
    <label for="">Enter any Character : </label>
    <input type="text" id="char" required /> <br />
    <label for="">Result: </label>
    <input type="text" id="Result" only /> <br />
    <button onclick="VOWEL()">OUTPUT</button> <br />

    <h1>Given Alphabet is Uppercase or Not</h1>
    <label for="">Enter the Alphabet : </label>
    <input type="text" id="upper" required /> <b></b>
    <label for="">Result: </label>
    <input type="text" id="Result6" only /> <br />
    <button onclick="UPPER()">OUTPUT</button> <br />

    <h1>Given Alphabet is Lowercase or Not</h1>
    <label for="">Enter the Alphabet : </label>
    <input type="text" id="lower" required /> <br />
    <label for="">Result: </label>
    <input type="text" id="Result7" only /> <br />
    <button onclick="LOWER()">OUTPUT</button> <br />

    <h1>Check number Between the range 1 to 10</h1>

    <label for="">Enter a Number : </label>
    <input type="text" id="num" required /> <br />
    <label for="">Result: </label>
    <input type="text" id="Result2" only /> <br />
    <button onclick="Range()">OUTPUT</button> <br />

    <h1>Give letter is aphabet or not</h1>

    <label for="">Enter any Aphabet : </label>
    <input type="text" id="cha" required /> <br />
    <label for="">Result: </label>
    <input type="text" id="Result3" readonly /> <br />
    <button onclick="ALPH()">OUTPUT</button> <br />

    <h1>check give number is digit or not</h1>
    <label for="">Enter Digit: </label>
    <input type="text" id="digit" required /> <br />
    <label for="">Result: </label>
    <input type="text" id="Result4" readonly /> <br />
    <button onclick="DIGIT()">OUTPUT</button> <br />

    <h1>Check Login credentials success or Invalid</h1>
    <label for="">Enter Username: </label>
    <input type="text" id="username" required /> <br />
    <label for="">Enter password: </label>
    <input type="text" id="pass" required /> <br />
    <label for="">Result: </label> <br />

    <input type="text" id="Result5" readonly />
    <button onclick="LOGIN()">OUTPUT</button>

    <script type="text/javascript" src="if-else.js"></script>
  </body>
</html>
